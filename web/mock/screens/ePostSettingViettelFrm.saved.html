<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="erp-contract" content="1.0"><title>Thiết lập kết nối API với VIETEL POST</title></head>
<body>
<section data-erp="screen" data-screen-id="ePostSettingViettelFrm" data-form-type="CUSTOM" data-mode="view" data-screen-key="ePostSettingViettelFrm" data-menu-id="0104">
<h1>Thiết lập kết nối API với VIETEL POST</h1>
<div data-erp="messages"><p data-erp="message" data-msg-type="success">Đã lưu thiết lập (mock).</p></div>
<menu data-erp="toolbar">
  <li><a data-action="edit" href="/mock/screens/ePostSettingViettelFrm.edit.html" data-target="self" data-shortcut="F3">Sửa</a></li>
  <li><button type="submit" form="rec-ePostSettingViettelFrm" formaction="/mock/actions/custom-ok.html" formmethod="post" data-action="custom" data-icon="check">Kiểm tra kết nối</button></li>
  <li><a data-action="reload" href="/mock/screens/ePostSettingViettelFrm.html" data-target="self">Nạp lại</a></li>
</menu>
<div data-erp="messages"><p data-erp="message" data-msg-type="info">Mật khẩu/token API chỉ lưu ở máy chủ, không hiển thị lại. Để trống ô mật khẩu khi lưu nghĩa là giữ nguyên.</p></div>
<form data-erp="record" id="rec-ePostSettingViettelFrm" method="post" action="/mock/screens/ePostSettingViettelFrm.saved.html" data-key-field="ID" data-key="1">
<input type="hidden" name="__RequestVerificationToken" value="mock-token">
<fieldset data-erp="tab" data-tab-id="1"><legend>Kết nối API</legend>
<div data-erp="field" data-control="text" data-span="30"><label for="f-ePostSettingViettelFrm-ApiUrl">Địa chỉ API</label><input id="f-ePostSettingViettelFrm-ApiUrl" name="ApiUrl" value="https://partner-api.example.vn/v2" readonly></div>
<div data-erp="field" data-control="text" data-span="10"><label for="f-ePostSettingViettelFrm-ApiVersion">Phiên bản</label><input id="f-ePostSettingViettelFrm-ApiVersion" name="ApiVersion" value="2.0" readonly></div>
<div data-erp="field" data-control="text" data-span="15"><label for="f-ePostSettingViettelFrm-ApiUser">Tài khoản API</label><input id="f-ePostSettingViettelFrm-ApiUser" name="ApiUser" value="demo-api" readonly></div>
<div data-erp="field" data-control="password" data-span="15"><label for="f-ePostSettingViettelFrm-ApiPassword">Mật khẩu API</label><input id="f-ePostSettingViettelFrm-ApiPassword" name="ApiPassword" type="password" autocomplete="new-password" value="" readonly></div>
<div data-erp="field" data-control="checkbox" data-span="10"><label for="f-ePostSettingViettelFrm-IsSandbox">Môi trường thử nghiệm</label><input type="hidden" name="IsSandbox" value="false"><input id="f-ePostSettingViettelFrm-IsSandbox" name="IsSandbox" type="checkbox" value="true" checked disabled></div>
</fieldset>
<fieldset data-erp="tab" data-tab-id="2"><legend>Người gửi &amp; dịch vụ</legend>
<div data-erp="field" data-control="text" data-span="20"><label for="f-ePostSettingViettelFrm-SenderName">Tên người gửi</label><input id="f-ePostSettingViettelFrm-SenderName" name="SenderName" value="CÔNG TY CỔ PHẦN DEMO MEDCOM" readonly></div>
<div data-erp="field" data-control="text" data-span="10"><label for="f-ePostSettingViettelFrm-SenderPhone">Điện thoại</label><input id="f-ePostSettingViettelFrm-SenderPhone" name="SenderPhone" value="028 3800 0000" readonly></div>
<div data-erp="field" data-control="select" data-span="10"><label for="f-ePostSettingViettelFrm-SenderProvince">Tỉnh/TP</label><select id="f-ePostSettingViettelFrm-SenderProvince" name="SenderProvince" disabled><option value=""></option><option value="Hà Nội">Hà Nội</option><option value="TP. Hồ Chí Minh" selected>TP. Hồ Chí Minh</option><option value="Đà Nẵng">Đà Nẵng</option><option value="Cần Thơ">Cần Thơ</option><option value="Hải Phòng">Hải Phòng</option></select></div>
<div data-erp="field" data-control="text" data-span="40"><label for="f-ePostSettingViettelFrm-SenderAddress">Địa chỉ lấy hàng</label><input id="f-ePostSettingViettelFrm-SenderAddress" name="SenderAddress" value="Kho Hồ Chí Minh, 25 Điện Biên Phủ, Quận Bình Thạnh" readonly></div>
<div data-erp="field" data-control="select" data-span="14"><label for="f-ePostSettingViettelFrm-DefaultService">Dịch vụ mặc định</label><select id="f-ePostSettingViettelFrm-DefaultService" name="DefaultService" disabled><option value=""></option><option value="VCN" selected>Chuyển phát nhanh</option><option value="VTK">Chuyển phát tiết kiệm</option><option value="VHT">Hỏa tốc</option></select></div>
<div data-erp="field" data-control="select" data-span="13"><label for="f-ePostSettingViettelFrm-DefaultPayer">Người trả cước</label><select id="f-ePostSettingViettelFrm-DefaultPayer" name="DefaultPayer" disabled><option value=""></option><option value="1" selected>Người gửi trả</option><option value="2">Người nhận trả</option></select></div>
<div data-erp="field" data-control="checkbox" data-span="13"><label for="f-ePostSettingViettelFrm-CODDefault">Thu hộ (COD) mặc định</label><input type="hidden" name="CODDefault" value="false"><input id="f-ePostSettingViettelFrm-CODDefault" name="CODDefault" type="checkbox" value="true" disabled></div>
</fieldset>
</form>
</section>
</body></html>
