<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="erp-contract" content="1.0"><title>Sao chép quyền</title></head>
<body>
<section data-erp="dialog" data-size="sm"><h1>Sao chép quyền từ nhóm khác</h1>
<form data-erp="record" id="dlg-copyperm" method="post" action="/mock/actions/custom-ok.html"><input type="hidden" name="__RequestVerificationToken" value="mock-token">
<div data-erp="field" data-control="select" data-span="40"><label for="f-dlg-FromGroup">Sao chép từ nhóm</label><select id="f-dlg-FromGroup" name="FromGroup"><option value=""></option><option value="ADMIN">Quản trị hệ thống</option><option value="GIAMDOC">Ban giám đốc</option><option value="KETOAN">Kế toán</option><option value="KETOAN-HCM">Kế toán chi nhánh HCM</option><option value="THUQUY">Thủ quỹ</option><option value="KHO">Thủ kho</option><option value="MUAHANG">Mua hàng</option><option value="KINHDOANH" selected>Kinh doanh</option><option value="KYTHUAT">Kỹ thuật – bảo hành</option><option value="CSKH">Chăm sóc khách hàng</option><option value="DAILY">Đại lý (Web)</option><option value="NHANSU">Hành chính – nhân sự</option></select></div>
<div data-erp="field" data-control="multiselect" data-span="40"><label for="f-dlg-ToGroups">Áp cho các nhóm</label><select id="f-dlg-ToGroups" name="ToGroups" multiple><option value="ADMIN">Quản trị hệ thống</option><option value="GIAMDOC">Ban giám đốc</option><option value="KETOAN">Kế toán</option><option value="KETOAN-HCM">Kế toán chi nhánh HCM</option><option value="THUQUY">Thủ quỹ</option><option value="KHO">Thủ kho</option><option value="MUAHANG">Mua hàng</option><option value="KINHDOANH">Kinh doanh</option><option value="KYTHUAT">Kỹ thuật – bảo hành</option><option value="CSKH">Chăm sóc khách hàng</option><option value="DAILY">Đại lý (Web)</option><option value="NHANSU">Hành chính – nhân sự</option></select></div>
<div data-erp="field" data-control="checkbox" data-span="40"><label for="f-dlg-Overwrite">Ghi đè quyền đang có</label><input type="hidden" name="Overwrite" value="false"><input id="f-dlg-Overwrite" name="Overwrite" type="checkbox" value="true"></div>
<button type="submit" data-action="save">Sao chép</button> <button type="button" data-action="close">Đóng</button></form></section>
</body></html>
